name: bubble
description: "泡泡 Bubble V2.0 — 本地优先 iOS AI 伴侣应用"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.14.0 <4.0.0"
  flutter: ">=3.50.0 <3.51.0"

dependencies:
  flutter:
    sdk: flutter

  # 状态管理与路由（TECH_STACK §2 锁定版本）
  flutter_riverpod: 3.5.0
  go_router: 18.1.4

  # 数据层：SQLite + Drift（版本锁定见 TECH_STACK §4）
  # 注意：sqlite3_flutter_libs 已 EOL（0.6.0+eol 为空壳），sqlite3 3.x 经 Dart hooks
  # 自动捆绑预编译 SQLite；SQLCipher 经 hooks user_defines 启用（见文件末尾 hooks 配置）。
  drift: 2.35.4
  sqlite3: 3.9.1

  # 网络（阶段 3 DeepSeek 用，骨架先接入）
  dio: 5.11.1

  # 模型/序列化注解（freezed 代码生成在阶段 1-2 接入 build_runner）
  freezed_annotation: 3.1.0
  json_annotation: ^4.9.0

  # 平台能力
  path_provider: 2.1.6
  flutter_secure_storage: 10.3.1
  local_auth: 3.0.2
  image_picker: 1.2.4
  flutter_local_notifications: 23.0.3
  timezone: ^0.11.0

  # 工具
  uuid: ^4.5.1
  intl: ^0.20.0
  crypto: ^3.0.8
  shared_preferences: ^2.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # 代码生成
  build_runner: ^2.17.1
  drift_dev: 2.35.3
  freezed: 4.0.3
  json_serializable: 6.15.2

flutter:
  uses-material-design: true

# SQLite 原生构建配置（sqlite3 3.x Dart hooks 机制）
# source: sqlcipher —— 启用 SQLCipher 加密（替代已 EOL 的 sqlcipher_flutter_libs）。
# 首次构建会从 sqlite3.dart 的 GitHub releases 下载预编译产物；
# 若真机验证失败（T1.2 spike），降级候选：source: sqlite3mc（SQLite3 Multiple Ciphers）。
hooks:
  user_defines:
    sqlite3:
      source: sqlcipher
