<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>泡泡 Bubble V2.0 — UI 视觉稿与交互原型（设计产物，非业务代码）</title>
<style>
/* ============ 设计系统 Token（清新温柔 Fresh & Gentle） ============ */
:root{
  --bg:#F2F8FC; --surface:#FFFFFF; --surfaceAlt:#E9F2FA;
  --primary:#58AEF0; --primaryDeep:#2E7FC2; --mist:#A9CFE8;
  --lavender:#B7A6E8; --lavenderDeep:#7C6BC4; --pink:#F2B8CD; --pinkDeep:#C4708F;
  --text:#29405A; --textSub:#7A8FA6;
  --bubbleUserA:#58AEF0; --bubbleUserB:#7CC3F5;
  --success:#6FBF8F; --warn:#E8B96A; --danger:#E2837F;
  --shadow:0 2px 12px rgba(88,174,240,.10);
  --stroke:#DCE9F4;
}
[data-theme="dark"]{
  --bg:#0F1722; --surface:#1A2532; --surfaceAlt:#223144;
  --primary:#6FB9F2; --primaryDeep:#8FCBF2; --mist:#31506B;
  --lavender:#9C8BD4; --lavenderDeep:#B7A8E6; --pink:#D99BB4; --pinkDeep:#E9B7CB;
  --text:#E6EDF4; --textSub:#8FA3B8;
  --bubbleUserA:#3E88C4; --bubbleUserB:#5BA6D9;
  --shadow:0 2px 14px rgba(0,0,0,.35);
  --stroke:#2C3D52;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased}
body{background:linear-gradient(160deg,#DDEBf6,#EFEAF7 60%,#F7E9EF);font-family:"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;color:var(--text);min-height:100vh;padding:18px}
[data-theme="dark"] body{background:linear-gradient(160deg,#0B121C,#131022 60%,#1B1420)}

/* ============ 顶部工具条 ============ */
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;max-width:1200px;margin:0 auto 18px}
.toolbar h1{font-size:16px;font-weight:600;margin-right:auto}
.tbtn{border:1px solid var(--stroke);background:var(--surface);color:var(--text);padding:8px 16px;border-radius:14px;font-size:13px;cursor:pointer;box-shadow:var(--shadow)}
.tbtn.active{background:var(--primary);border-color:var(--primary);color:#fff}
.note{font-size:12px;color:var(--textSub);max-width:1200px;margin:0 auto 16px;line-height:1.7}

/* ============ 手机框 ============ */
.phone{width:390px;height:844px;background:var(--bg);border-radius:48px;border:8px solid #16233A;position:relative;overflow:hidden;flex:none;box-shadow:0 18px 60px rgba(20,40,80,.25)}
.phone .screen{position:absolute;inset:0;display:flex;flex-direction:column}
.statusbar{height:44px;display:flex;justify-content:space-between;align-items:center;padding:0 26px;font-size:13px;font-weight:600;flex:none}
.statusbar .dot{width:110px;height:22px;background:#16233A;border-radius:11px;margin:0 auto}
.notchless .statusbar{padding-top:8px}

/* 画廊 */
#gallery{display:flex;flex-wrap:wrap;gap:34px;justify-content:center}
.gcell{display:flex;flex-direction:column;gap:10px;align-items:center}
.gcap{font-size:13px;color:var(--text);font-weight:600}
.gsub{font-size:11px;color:var(--textSub)}
[data-theme="dark"] .phone{border-color:#050A12}

/* 原型舞台 */
#stage{display:none;justify-content:center}
#stage.show{display:flex}

/* ============ 通用页面元素 ============ */
.page{flex:1;display:none;flex-direction:column;overflow:hidden}
.page.on{display:flex}
.scroll{flex:1;overflow-y:auto;padding:14px 16px 96px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.navbar{flex:none;height:52px;display:flex;align-items:center;gap:10px;padding:0 16px;font-size:17px;font-weight:600}
.navbar .back{width:32px;height:32px;border-radius:12px;background:var(--surfaceAlt);display:flex;align-items:center;justify-content:center;cursor:pointer;border:none;color:var(--text)}
.h-title{font-size:24px;font-weight:700;margin:4px 0 12px}
.h-sub{font-size:12px;color:var(--textSub);margin-top:-10px;margin-bottom:14px}

.card{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:16px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.t1{font-size:15px;font-weight:600}
.t2{font-size:12.5px;color:var(--textSub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:3px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:6px 12px;border-radius:14px;background:var(--surfaceAlt);color:var(--textSub);border:none;cursor:pointer;flex:none}
.chip.on{background:var(--primary);color:#fff}
.badge{font-size:11px;padding:3px 9px;border-radius:10px;font-weight:600;flex:none}
.b-blue{background:rgba(88,174,240,.14);color:var(--primaryDeep)}
.b-lav{background:rgba(183,166,232,.18);color:var(--lavenderDeep)}
.b-pink{background:rgba(242,184,205,.2);color:var(--pinkDeep)}
.b-green{background:rgba(111,191,143,.16);color:#4E9E72}
.b-warn{background:rgba(232,185,106,.18);color:#B98A3A}
.b-red{background:rgba(226,131,127,.16);color:#C05B57}
.avatar{width:40px;height:40px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff}
.av-bubble{background:linear-gradient(150deg,#7CC3F5,#B7A6E8);box-shadow:0 0 0 3px rgba(124,195,245,.25)}
.av-user{background:linear-gradient(150deg,#F2B8CD,#F6D6B8)}
.av-sm{width:30px;height:30px;font-size:11px}

/* 底部导航 */
.tabbar{position:absolute;left:14px;right:14px;bottom:16px;height:60px;background:var(--surface);border-radius:24px;box-shadow:0 6px 24px rgba(20,50,90,.18);display:flex;z-index:30;border:1px solid var(--stroke)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;color:var(--textSub);cursor:pointer;border:none;background:none;font-family:inherit}
.tab svg{width:20px;height:20px}
.tab.on{color:var(--primaryDeep);font-weight:700}
.tab.on .pill{background:rgba(88,174,240,.15);border-radius:14px;padding:4px 14px}
.tab .pill{padding:4px 14px;border-radius:14px}

.fab{position:absolute;right:22px;bottom:92px;width:56px;height:56px;border-radius:50%;background:linear-gradient(150deg,var(--lavender),var(--primary));color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;box-shadow:0 8px 20px rgba(124,108,196,.4);cursor:pointer;border:none;z-index:31;flex-direction:column;line-height:1.2}
.fab small{font-size:9px;opacity:.85}

/* 状态条（自主思考可视化） */
.thinkbar{background:linear-gradient(120deg,rgba(183,166,232,.22),rgba(88,174,240,.14));border:1px solid rgba(183,166,232,.35);border-radius:18px;padding:10px 14px;font-size:12.5px;color:var(--text);display:flex;align-items:center;gap:10px;margin-bottom:14px;cursor:pointer}
.thinkdot{width:8px;height:8px;border-radius:50%;background:var(--lavender);box-shadow:0 0 0 4px rgba(183,166,232,.25);animation:breathe 2.4s ease-in-out infinite;flex:none}
@keyframes breathe{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.35);opacity:.55}}

/* 聊天气泡 */
.msg{display:flex;gap:8px;margin-bottom:4px;align-items:flex-end}
.msg.me{justify-content:flex-end}
.bubble{max-width:76%;padding:10px 14px;border-radius:22px;font-size:14.5px;line-height:1.55}
.bubble.ai{background:var(--surface);border:1px solid var(--stroke);border-top-left-radius:6px;box-shadow:var(--shadow)}
.bubble.me{background:linear-gradient(140deg,var(--bubbleUserA),var(--bubbleUserB));color:#fff;border-top-right-radius:6px}
.mtime{font-size:10.5px;color:var(--textSub);flex:none;margin-bottom:6px}
.tdiv{text-align:center;margin:14px 0}
.tdiv span{font-size:11px;color:var(--textSub);background:var(--surfaceAlt);padding:4px 12px;border-radius:12px}
.srcnote{font-size:11.5px;background:rgba(183,166,232,.14);border:1px dashed var(--lavender);color:var(--text);border-radius:14px 14px 14px 4px;padding:8px 12px;margin-bottom:6px;max-width:80%;cursor:pointer}
.typing{display:flex;gap:5px;padding:14px 16px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--mist);animation:float 1.4s ease-in-out infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.inputbar{position:absolute;left:14px;right:14px;bottom:14px;height:50px;background:var(--surface);border:1px solid var(--stroke);border-radius:18px;display:flex;align-items:center;padding:0 8px 0 16px;gap:10px;box-shadow:var(--shadow);z-index:30;font-size:13.5px;color:var(--textSub)}
.inputbar .send{width:38px;height:38px;border-radius:50%;background:var(--primary);display:flex;align-items:center;justify-content:center;flex:none}
.inputbar .plus{width:30px;height:30px;border-radius:12px;background:var(--surfaceAlt);display:flex;align-items:center;justify-content:center;flex:none}

/* 主页时间线/经历 */
.tl{position:relative;padding-left:26px}
.tl:before{content:"";position:absolute;left:9px;top:8px;bottom:8px;width:2px;background:var(--stroke)}
.tl-item{position:relative;margin-bottom:14px}
.tl-item:before{content:"";position:absolute;left:-23px;top:18px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:3px solid var(--primary)}
.tl-item.lav:before{border-color:var(--lavender)}
.tl-item.pink:before{border-color:var(--pink)}
.seg{display:flex;background:var(--surfaceAlt);border-radius:16px;padding:4px;gap:4px;margin-bottom:14px}
.seg button{flex:1;border:none;background:none;font-size:12.5px;padding:8px;border-radius:12px;color:var(--textSub);cursor:pointer;font-family:inherit}
.seg button.on{background:var(--surface);color:var(--text);font-weight:700;box-shadow:var(--shadow)}
.lock{font-size:11px;color:var(--textSub);display:flex;align-items:center;gap:6px;background:var(--surfaceAlt);border-radius:12px;padding:8px 12px;margin-top:10px}
.field{margin-bottom:12px}
.field label{font-size:12px;color:var(--textSub);display:block;margin-bottom:5px}
.field .v{background:var(--surfaceAlt);border-radius:14px;padding:11px 14px;font-size:13.5px;line-height:1.55}
.btn{border:none;border-radius:14px;padding:12px 18px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;width:100%}
.btn-p{background:var(--primary);color:#fff}
.btn-s{background:var(--surfaceAlt);color:var(--text)}
.btn-d{background:rgba(226,131,127,.14);color:#C05B57}
.header-cloud{background:linear-gradient(160deg,rgba(124,195,245,.35),rgba(183,166,232,.30) 55%,rgba(242,184,205,.25));border-radius:24px;padding:22px 18px;text-align:center;margin-bottom:14px;position:relative;overflow:hidden}
.header-cloud:before{content:"";position:absolute;top:-30px;right:-24px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.4)}
.header-cloud:after{content:"";position:absolute;bottom:-34px;left:-20px;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.28)}
[data-theme="dark"] .header-cloud:before,[data-theme="dark"] .header-cloud:after{background:rgba(111,185,242,.10)}
.big-avatar{width:84px;height:84px;border-radius:50%;margin:0 auto 10px;background:linear-gradient(150deg,#7CC3F5,#B7A6E8);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 5px rgba(124,195,245,.28),0 8px 24px rgba(124,108,196,.35);position:relative;z-index:1}
.big-avatar svg{width:44px;height:44px}
.paper{background:var(--surface);border-radius:20px;padding:20px 18px;box-shadow:var(--shadow);position:relative}
.paper:before{content:"";position:absolute;left:0;right:0;top:0;height:56px;border-radius:20px 20px 0 0;background:repeating-linear-gradient(0deg,rgba(88,174,240,.05) 0 26px,transparent 26px 27px)}
.stamp{position:absolute;top:16px;right:16px;border:2px dashed var(--primary);color:var(--primaryDeep);font-size:12px;font-weight:700;border-radius:50%;width:62px;height:62px;display:flex;align-items:center;justify-content:center;transform:rotate(12deg);opacity:.85}
.empty{margin:10px 0 14px;border:1.5px dashed var(--mist);border-radius:16px;padding:14px;text-align:center;font-size:12px;color:var(--textSub)}
svg.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

/* ============ 次级页补充组件（同一 Token 体系） ============ */
.month{font-size:11px;color:var(--textSub);background:var(--surfaceAlt);display:inline-block;padding:4px 12px;border-radius:12px;margin:2px 0 10px}
.hl{background:rgba(88,174,240,.28);border-radius:4px;padding:0 3px}
.radio{width:18px;height:18px;border-radius:50%;border:2px solid var(--mist);flex:none}
.radio.on{border-color:var(--primary);background:var(--primary);box-shadow:inset 0 0 0 3px var(--surface)}
.imggrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.imggrid .ph{aspect-ratio:1;border-radius:12px}
.bars{display:flex;gap:6px;align-items:flex-end;height:72px;padding:0 4px}
.bars i{flex:1;border-radius:6px 6px 2px 2px;background:linear-gradient(180deg,var(--primary),rgba(88,174,240,.35))}
.overlay{position:absolute;inset:0;background:rgba(15,30,55,.38);z-index:40;display:flex;flex-direction:column}
.drawer{margin-top:auto;background:var(--surface);border-radius:24px 24px 0 0;padding:18px 18px 24px;box-shadow:0 -10px 34px rgba(15,40,80,.30)}
.step{display:flex;align-items:center;gap:12px;padding:8px 0}
.step .n{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;background:var(--surfaceAlt);color:var(--textSub);flex:none}
.step.done .n{background:rgba(111,191,143,.18);color:#4E9E72}
.step.cur .n{background:var(--lavender);color:#fff;box-shadow:0 0 0 4px rgba(183,166,232,.25)}
.step.cur .t1{color:var(--lavenderDeep)}
.diffgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dcol{background:var(--surfaceAlt);border-radius:14px;padding:12px;font-size:12.5px;line-height:1.65}
.dcol.new{background:rgba(111,191,143,.12)}
.dcol del{color:#C05B57}
.dcol ins{text-decoration:none;color:#4E9E72;background:rgba(111,191,143,.18);border-radius:4px;padding:0 3px}

/* ============ 浮层与补充组件（第二批补齐） ============ */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal i{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:12px;border-radius:10px;font-style:normal;position:relative;color:var(--text)}
.cal i.wd{font-size:10px;color:var(--textSub)}
.cal i.dot:after{content:"";position:absolute;bottom:4px;left:50%;transform:translateX(-50%);width:5px;height:5px;border-radius:50%;background:var(--primary)}
.cal i.dot.lav:after{background:var(--lavender)}
.cal i.dot.pink:after{background:var(--pink)}
.cal i.sel{background:var(--primary);color:#fff;font-weight:700}
.menuitem{display:flex;align-items:center;gap:12px;padding:13px 16px;font-size:14px;font-weight:600;border-bottom:1px solid var(--stroke)}
.menuitem:last-child{border-bottom:none}
.menuitem.danger{color:#C05B57}
.imgview{position:absolute;inset:0;background:#0B1119;z-index:45;display:flex;flex-direction:column}
</style>
</head>
<body>
<div class="toolbar">
  <h1>泡泡 Bubble V2.0 · UI 视觉稿与交互原型</h1>
  <button class="tbtn active" id="mGallery" onclick="setMode('gallery')">视觉稿画廊（静态）</button>
  <button class="tbtn" id="mStage" onclick="setMode('stage')">可点击原型（交互）</button>
  <button class="tbtn" id="tTheme" onclick="toggleTheme()">切换深色模式</button>
</div>
<div class="note">
  设计产物说明：本文件为 <b>HTML 设计原型</b>，与正式业务代码完全隔离（BubbleV2/design/），数据均为设计占位内容，不含业务逻辑或数据接入。
  「视觉稿画廊」= 全部 38 页静态视觉稿（主壳层 4 页 + 聊天域 4 页 + 次级页 30 页）；「可点击原型」= 浏览器中可点按导航的交互原型（次级页一律返回键返回，Tab 栏仅主壳层四主页显示——已确认的导航方案）；两者均为 <b>设计稿，不是 Flutter 实现</b>。
</div>

<div id="gallery"></div>
<div id="stage"><div class="phone notchless"><div class="screen" id="screen"></div></div></div>

<!-- ============ 页面模板 ============ -->
<template id="tpl-home">
<div class="page on" data-name="首页（会话列表）" data-sub="Tab1 · 一击直达核心循环">
  <div class="statusbar"><span>9:41</span><span class="dot"></span><span>5G ▮</span></div>
  <div class="scroll">
    <div class="row" style="margin:4px 0 12px"><div class="h-title" style="margin:0">消息</div><div class="grow"></div><span class="badge b-blue" data-nav="search" style="cursor:pointer">搜索</span></div>
    <div class="thinkbar" data-nav="think"><span class="thinkdot"></span><div class="grow">泡泡正在想… · 第 3 步 · 关联记忆中<div class="t2">2 条新发现 · 1 个想聊的话题</div></div><span class="badge b-lav">展开</span></div>
    <div class="card row" data-nav="chat" style="cursor:pointer">
      <div class="row" style="gap:0;margin-right:2px"><div class="avatar av-bubble av-sm">泡</div><div class="avatar av-user av-sm" style="margin-left:-8px">你</div></div>
      <div class="grow"><div class="t1">日常闲聊</div><div class="t2">泡泡：我在整理我们的回忆时发现…</div></div>
      <div style="text-align:center"><div class="badge b-blue">3</div><div class="t2" style="margin-top:4px">10:24</div></div>
    </div>
    <div class="card row">
      <div class="avatar av-bubble">泡</div>
      <div class="grow"><div class="t1">深夜信箱</div><div class="t2">你：这周辛苦了，谢谢你写的信</div></div>
      <div class="t2">昨天</div>
    </div>
    <div class="card row">
      <div class="avatar av-user">你</div>
      <div class="grow"><div class="t1">项目备忘</div><div class="t2">你：明天记得提醒我复盘</div></div>
      <div class="t2">周三</div>
    </div>
    <div class="empty">长按会话可重命名或删除 · 左上搜索可全局查找</div>
  </div>
  <button class="fab" data-nav="think">想想<small>让泡泡</small></button>
  <div class="tabbar">
    <button class="tab on" data-nav="home"><span class="pill"><svg class="ic" viewBox="0 0 24 24"><path d="M4 6h16v10H9l-5 4V6z"/></svg></span>消息</button>
    <button class="tab" data-nav="posts"><span class="pill"><svg class="ic" viewBox="0 0 24 24"><circle cx="8" cy="9" r="3.2"/><circle cx="16" cy="15" r="2.4"/></svg></span>说说</button>
    <button class="tab" data-nav="experience"><span class="pill"><svg class="ic" viewBox="0 0 24 24"><path d="M12 4v16M5 9l7-5 7 5"/></svg></span>时间线</button>
    <button class="tab" data-nav="profile"><span class="pill"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="3.4"/><path d="M5 20c1.2-4 4-5.5 7-5.5s5.8 1.5 7 5.5"/></svg></span>我的</button>
  </div>
</div>
</template>

<template id="tpl-chat">
<div class="page" data-name="聊天主界面" data-sub="QQ 式布局 · 品牌气泡 · 主动消息来源标注">
  <div class="statusbar"><span>9:41</span><span class="dot"></span><span>5G ▮</span></div>
  <div class="navbar"><button class="back" data-nav="home"><svg class="ic" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><span class="grow">日常闲聊</span><span class="badge b-blue" data-nav="chatSearch" style="cursor:pointer" title="会话内搜索">搜索</span><span class="badge b-blue" data-nav="settings" style="cursor:pointer" title="原型导航：会话信息/设置">会话·设置</span></div>
  <div class="scroll" style="padding-top:6px">
    <div class="tdiv"><span>今天 10:20</span></div>
    <div class="msg"><div class="avatar av-bubble av-sm">泡</div><div class="bubble ai">早上好呀～昨晚整理记忆的时候，翻到了我们上周聊过的「养植物计划」，你后来买到那盆薄荷了吗？</div></div>

<script>
/* 纯展示脚本：页面切换与画廊克隆，无任何业务逻辑 */
const PAGES=["tpl-home","tpl-chat","tpl-chatSearch","tpl-chatMenu","tpl-think","tpl-profile","tpl-persona","tpl-personaGrowth","tpl-personaSamples","tpl-personaHistory","tpl-personaDiff","tpl-preview","tpl-memory","tpl-memoryDetail","tpl-inbox","tpl-conflict","tpl-experience","tpl-posts","tpl-postDetail","tpl-postCompose","tpl-diary","tpl-diaryList","tpl-diaryCalendar","tpl-letter","tpl-letterList","tpl-letterCompose","tpl-settings","tpl-notify","tpl-capability","tpl-models","tpl-data","tpl-restore","tpl-wipe","tpl-migration","tpl-search","tpl-images","tpl-imageView","tpl-lock"];
const screen=document.getElementById("screen");
const nodes={};
PAGES.forEach(id=>{const n=document.getElementById(id).content.firstElementChild.cloneNode(true);nodes[n.dataset.name?n.dataset.name:n.id]=n;screen.appendChild(n);});
function showPage(key){ /* key 可能是 data-nav 值 */
  const map={"home":"tpl-home","chat":"tpl-chat","chatSearch":"tpl-chatSearch","chatMenu":"tpl-chatMenu","think":"tpl-think","profile":"tpl-profile","persona":"tpl-persona","personaGrowth":"tpl-personaGrowth","personaSamples":"tpl-personaSamples","personaHistory":"tpl-personaHistory","personaDiff":"tpl-personaDiff","preview":"tpl-preview","memory":"tpl-memory","memoryDetail":"tpl-memoryDetail","inbox":"tpl-inbox","conflict":"tpl-conflict","experience":"tpl-experience","posts":"tpl-posts","postDetail":"tpl-postDetail","postCompose":"tpl-postCompose","diary":"tpl-diary","diaryList":"tpl-diaryList","diaryCalendar":"tpl-diaryCalendar","letter":"tpl-letter","letterList":"tpl-letterList","letterCompose":"tpl-letterCompose","settings":"tpl-settings","notify":"tpl-notify","capability":"tpl-capability","models":"tpl-models","data":"tpl-data","restore":"tpl-restore","wipe":"tpl-wipe","migration":"tpl-migration","search":"tpl-search","images":"tpl-images","imageView":"tpl-imageView","lock":"tpl-lock"};
  const target=map[key]||"tpl-home";
  screen.querySelectorAll(".page").forEach(p=>p.classList.toggle("on",p.dataset.name===document.getElementById(target).content.firstElementChild.dataset.name));
  screen.querySelectorAll(".tab").forEach(t=>{const nav=t.getAttribute("data-nav");const label=t.textContent.trim();
    const active=(nav===key)||(key==="home"&&label==="消息")||(key==="profile"&&label==="我的");
    t.classList.toggle("on",active);});
  screen.querySelector(".scroll")?.scrollTo(0,0);
}
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-nav]");
  if(!el) return;
  if(el.closest("#gallery")){ setMode("stage"); }
  showPage(el.getAttribute("data-nav"));
});
/* 画廊：克隆每页为静态视觉稿 */
const gallery=document.getElementById("gallery");
PAGES.forEach(id=>{
  const page=document.getElementById(id).content.firstElementChild.cloneNode(true);
  page.classList.add("on"); /* 画廊中每页都要可见（原模板仅首页带 on） */
  const cell=document.createElement("div");cell.className="gcell";
  const ph=document.createElement("div");ph.className="phone notchless";
  const sc=document.createElement("div");sc.className="screen";sc.appendChild(page);ph.appendChild(sc);
  const cap=document.createElement("div");cap.innerHTML='<div class="gcap">'+page.dataset.name+'</div><div class="gsub">'+(page.dataset.sub||"")+'</div>';
  cell.appendChild(ph);cell.appendChild(cap);gallery.appendChild(cell);
});
function setMode(m){
  document.getElementById("gallery").style.display=m==="gallery"?"flex":"none";
  document.getElementById("stage").style.display=m==="stage"?"flex":"none";
  document.getElementById("stage").classList.toggle("show",m==="stage");
  document.getElementById("mGallery").classList.toggle("active",m==="gallery");
  document.getElementById("mStage").classList.toggle("active",m==="stage");
  if(m==="stage") showPage("home");
}
function toggleTheme(){
  const r=document.documentElement;
  r.dataset.theme=r.dataset.theme==="dark"?"light":"dark";
  document.getElementById("tTheme").textContent=r.dataset.theme==="dark"?"切换浅色模式":"切换深色模式";
}
</script>
