# Bubble V2.0 — iOS 未签名 IPA 构建（双版本 flavor）
# 版本：test = 测试版（com.dafeiyu.bubble.test，显示名 泡泡·测试）
#       prod = 正式版（com.dafeiyu.bubble，显示名 泡泡）
# push 触发默认构建 test；手动运行可选 prod。
# 产物为未签名 IPA，由爱思助手在本机完成签名与安装。
name: iOS 构建（未签名 IPA）

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      flavor:
        description: "构建版本"
        required: false
        default: test
        type: choice
        options: [test, prod]

permissions:
  contents: read

jobs:
  build-ipa:
    name: build ipa (${{ inputs.flavor || 'test' }}, no codesign)
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      FLAVOR: ${{ inputs.flavor || 'test' }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Flutter 3.50.1
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.1
          channel: stable
          cache: true

      - name: 打印工具链版本
        run: |
          flutter --version
          xcodebuild -version

      - name: 拉取依赖
        run: flutter pub get

      - name: 配置版本参数（Bundle ID 与显示名）
        run: |
          # 方案：Xcode 工程只保留 Debug/Release/Profile 三个基础配置，
          # 测试版/正式版的差异通过 FLUTTER_XCODE_* 环境变量在构建时注入，
          # 命令行级构建设置优先级最高，会覆盖工程内的兜底值。
          if [ "$FLAVOR" = "prod" ]; then
            echo "FLUTTER_XCODE_PRODUCT_BUNDLE_IDENTIFIER=com.dafeiyu.bubble" >> "$GITHUB_ENV"
            echo "FLUTTER_XCODE_DISPLAY_NAME=泡泡" >> "$GITHUB_ENV"
          else
            echo "FLUTTER_XCODE_PRODUCT_BUNDLE_IDENTIFIER=com.dafeiyu.bubble.test" >> "$GITHUB_ENV"
            echo "FLUTTER_XCODE_DISPLAY_NAME=泡泡·测试" >> "$GITHUB_ENV"
          fi
          echo "已写入环境变量，构建时注入 flavor=$FLAVOR"

      - name: 构建未签名 IPA（flavor 见 env.FLAVOR）
        run: |
          flutter build ipa --release --no-codesign --flavor "$FLAVOR"
          # Flutter 3.50 在 --no-codesign 下只产出 xcarchive，跳过 IPA 打包；
          # 按标准 Payload 结构手动打包未签名 IPA（爱思助手可签名安装）。
          ls build/ios/archive/
          rm -rf Payload
          mkdir -p Payload build/ios/ipa
          cp -R build/ios/archive/*.xcarchive/Products/Applications/Runner.app Payload/
          # 打包 Payload 目录本身（保留 Payload/ 前缀，符合 IPA 规范）
          zip -qry "build/ios/ipa/bubble-unsigned-$FLAVOR.ipa" Payload
          rm -rf Payload

      - name: 收集产物信息（路径 / 大小 / SHA256 / Bundle ID）
        run: |
          mkdir -p artifacts
          IPA_PATH="build/ios/ipa/bubble-unsigned-$FLAVOR.ipa"
          echo "IPA 路径: $IPA_PATH"
          ls -lh "$IPA_PATH"
          echo "--- IPA 内条目（前 20 行）---"
          unzip -l "$IPA_PATH" | head -20
          shasum -a 256 "$IPA_PATH" | tee artifacts/SHA256.txt
          cp "$IPA_PATH" artifacts/
          # 从 IPA 内部提取 Info.plist 验证版本标识（测试版/正式版 Bundle ID 正确性）
          unzip -p "$IPA_PATH" "Payload/Runner.app/Info.plist" > /tmp/plist.bin
          plutil -convert xml1 /tmp/plist.bin -o /tmp/plist.xml
          grep -A1 -E "CFBundleIdentifier|CFBundleDisplayName" /tmp/plist.xml \
            | tee artifacts/bundle-id.txt
          flutter --version > artifacts/flutter-version.txt
          cat artifacts/SHA256.txt artifacts/bundle-id.txt

      - name: 校验 Bundle ID 与显示名
        run: |
          if [ "$FLAVOR" = "prod" ]; then
            EXPECT_ID="com.dafeiyu.bubble"
            EXPECT_NAME="泡泡"
          else
            EXPECT_ID="com.dafeiyu.bubble.test"
            EXPECT_NAME="泡泡·测试"
          fi
          echo "EXPECT_ID=$EXPECT_ID"
          echo "EXPECT_NAME=$EXPECT_NAME"
          grep -qF "<string>$EXPECT_ID</string>" artifacts/bundle-id.txt \
            || { echo "::error::Bundle ID 校验失败"; cat artifacts/bundle-id.txt; exit 1; }
          grep -qF "<string>$EXPECT_NAME</string>" artifacts/bundle-id.txt \
            || { echo "::error::显示名校验失败"; cat artifacts/bundle-id.txt; exit 1; }
          echo "校验通过"

      - name: 校验后台任务配置（BGTaskScheduler）
        run: |
          # 任务标识固定（不随 Bundle ID 变化），避免第三方重签改写 Bundle ID 后
          # 运行期标识与 plist 不一致导致 BGTaskScheduler Code=3。
          grep -qF "<string>com.dafeiyu.bubble.bgtask.refresh</string>" /tmp/plist.xml \
            || { echo "::error::BGTaskSchedulerPermittedIdentifiers 缺少 refresh"; exit 1; }
          grep -qF "<string>com.dafeiyu.bubble.bgtask.processing</string>" /tmp/plist.xml \
            || { echo "::error::BGTaskSchedulerPermittedIdentifiers 缺少 processing"; exit 1; }
          grep -qF "<string>processing</string>" /tmp/plist.xml \
            || { echo "::error::UIBackgroundModes 缺少 processing"; exit 1; }
          echo "后台任务配置校验通过"

      - name: 上传 IPA 产物
        uses: actions/upload-artifact@v4
        with:
          name: bubble-unsigned-ipa-${{ env.FLAVOR }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
