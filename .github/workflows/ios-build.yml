# Bubble V2.0 — iOS 未签名 IPA 构建（双版本 flavor）
# 版本：test = 测试版（com.dafeiyu.bubble.test，显示名 泡泡·测试）
#       prod = 正式版（com.dafeiyu.bubble，显示名 泡泡）
# push 触发默认构建 test；手动运行可选 prod。
# 产物为未签名 IPA，由爱思助手在本机完成签名与安装。
name: iOS 构建（未签名 IPA）

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      flavor:
        description: "构建版本"
        required: false
        default: test
        type: choice
        options: [test, prod]

permissions:
  contents: read

jobs:
  build-ipa:
    name: build ipa (${{ inputs.flavor || 'test' }}, no codesign)
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      FLAVOR: ${{ inputs.flavor || 'test' }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Flutter 3.50.1
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.1
          channel: stable
          cache: true

      - name: 打印工具链版本
        run: |
          flutter --version
          xcodebuild -version

      - name: 拉取依赖
        run: flutter pub get

      - name: 构建未签名 IPA（flavor 见 env.FLAVOR）
        run: |
          flutter build ipa --release --no-codesign --flavor "$FLAVOR"
          # Flutter 3.50 在 --no-codesign 下只产出 xcarchive，跳过 IPA 打包；
          # 按标准 Payload 结构手动打包未签名 IPA（爱思助手可签名安装）。
          ls build/ios/archive/
          mkdir -p Payload build/ios/ipa
          cp -R build/ios/archive/*.xcarchive/Products/Applications/Runner.app Payload/
          (cd Payload && zip -qry "../bubble-unsigned-$FLAVOR.ipa" .)
          mv "bubble-unsigned-$FLAVOR.ipa" "build/ios/ipa/bubble-unsigned-$FLAVOR.ipa"
          rm -rf Payload

      - name: 收集产物信息（路径 / 大小 / SHA256 / Bundle ID）
        run: |
          mkdir -p artifacts
          IPA_PATH=$(ls build/ios/ipa/*.ipa | head -n 1)
          echo "IPA 路径: $IPA_PATH"
          ls -lh "$IPA_PATH"
          shasum -a 256 "$IPA_PATH" | tee artifacts/SHA256.txt
          cp "$IPA_PATH" artifacts/
          # 从 IPA 内部提取 Info.plist 验证版本标识（测试版/正式版 Bundle ID 正确性）
          unzip -p "$IPA_PATH" "Payload/Runner.app/Info.plist" > /tmp/plist.bin 2>/dev/null || true
          if [ -s /tmp/plist.bin ]; then
            plutil -convert xml1 /tmp/plist.bin -o /tmp/plist.xml 2>/dev/null || true
            (grep -A1 -E "CFBundleIdentifier|CFBundleDisplayName" /tmp/plist.xml || true) | tee artifacts/bundle-id.txt
          else
            echo "IPA 内 Info.plist 提取失败，记录 archive 结构供排查" | tee artifacts/bundle-id.txt
            find build/ios/archive -name "*.plist" | head -10 | tee -a artifacts/bundle-id.txt
          fi
          flutter --version > artifacts/flutter-version.txt
          cat artifacts/SHA256.txt artifacts/bundle-id.txt

      - name: 上传 IPA 产物
        uses: actions/upload-artifact@v4
        with:
          name: bubble-unsigned-ipa-${{ env.FLAVOR }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
